<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação Keyframe</title>
    <style>
*{
    box-sizing: border-box;
}
.navbar{
    display: flex;
justify-content: space-between;
align-items: center;
height: auto;
background-color: rgb(17, 13, 240);
padding: 15px;
color: black;
border-bottom: 5px solid rgb(56, 35, 247);
border-radius: 10px;

}

@keyframes
flutuar{
    0%{
        transform: translateY(0px);
    }
    50%{
        transform: translateY(20px);
    }
    100%{
        transform: translateY(0px);
    }

}

.icone-bau{
    margin: 50px;
    width: 150px;
    height: auto;
    animation: flutuar 2.5s ease-in-out infinite;
}

/* Responsividade para telas menores que 768px */
@media (max-widht: 78px){
    .navbar{
        flex-direction: column;
        height: auto;
        gap: 10px;
    }
}

a{
    color: black;
    text-decoration: none;

}

    </style>
</head>
<body>
    <header class="navbar">
        <h1>
            Gamer Store
        </h1>
        <nav>
        <a href="">Início</a>
        <a href="">Jogos</a>
        <a href="">Contato</a>
    </nav>
    </header>
    <main>
<div class="card-jogo">
<img src="https://cdn-icons-png.flaticon.com/512/4883/4883370.png" alt="Baú de Oferta" class="icone-bau">
</div>

    </main>
    
</body>
</html>
